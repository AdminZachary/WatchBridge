name: Bug Report/Support
description: Report a bug or get help with WatchBridge
body:
- type: markdown
  attributes:
    value: "Thank you for helping WatchBridge improve! To help us track down the bug, please fill out the following information:"
- type: markdown
  attributes:
    value: "## Bug Information"
- type: textarea
  id: info
  attributes:
    label: Describe the issue
    description: A brief summary of the problem and how to reproduce it
    placeholder: Description here...
  validations:
    required: true
- type: textarea
  id: error
  attributes:
    label: Error message
    description: "If this issue has an error message, click \"Copy to Clipboard\" in WatchBridge and paste here. You can also upload screenshots, paste logs, or upload logfiles here."
    placeholder: Paste error here
- type: checkboxes
  id: suggestions
  attributes:
    label: "Please read and follow any suggestions WatchBridge gives before making this issue."
    description: WatchBridge gives suggestions for many common errors. If you open an issue about one of these errors and did not try the suggestions, you will simply be told to follow the suggestions.
    options:
      - label: I followed ALL suggestions given by WatchBridge
        required: true
- type: markdown
  attributes:
    value: "## Desktop Information"
- type: input
  id: os
  attributes:
    label: Computer OS
    description: Which operating system and version are you running WatchBridge on? (Windows 11, macOS 15, etc)
    placeholder: Windows 11
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: WatchBridge version
    description: Which version of WatchBridge are you experiencing this problem with? (shown in the app header, e.g. v0.1.1)
    placeholder: v0.1.1
  validations:
    required: true
- type: dropdown
  id: package
  attributes:
    label: Which WatchBridge download did you use?
    description: "Windows ships as a .zip; macOS ships as a .dmg, one per architecture. Check the file you actually downloaded."
    options:
      - .zip (Windows)
      - .dmg (macOS, Apple Silicon / arm64)
      - .dmg (macOS, Intel / x86_64)
      - Built from source
      - Other (specify in additional info)
  validations:
    required: true
- type: checkboxes
  id: computerceritifcation
  attributes:
    label: Please certify that you have the Apple software your platform needs.
    description: On Windows you need iTunes or the Apple Devices app (Apple Mobile Device Service). On macOS no extra software is required.
    options:
      - label: I certify the above is true
        required: true
- type: markdown
  attributes:
    value: "## iPhone/iPad Information"
- type: input
  id: ios
  attributes:
    label: iOS Version
    description: What iOS version is your iPhone/iPad running? If you are on a developer beta, please include that
    placeholder: "26.3"
  validations:
    required: true
- type: input
  id: phone
  attributes:
    label: Phone model
    description: What kind of iPhone/iPad is this?
    placeholder: iPhone 16
  validations:
    required: true
- type: checkboxes
  id: phonecertification
  attributes:
    label: "Please certify the following about your iPhone/iPad:"
    description: If any of these things are not true, please make sure they are and try again before opening this issue.
    options:
      - label: My phone is in developer mode
        required: true
      - label: My phone has a passcode set
        required: true
      - label: My phone is connected to my computer over USB
        required: true
- type: markdown
  attributes:
    value: "## Apple Account Information"
- type: dropdown
  id: free
  attributes:
    label: Do you have a paid or free developer account?
    description: Unless you specifically paid to join Apple's developer program, choose free.
    options:
      - Free
      - Paid
  validations:
    required: true
- type: dropdown
  id: 2fa
  attributes:
    label: Two-factor auth (2FA) type 
    description: "Most accounts use \"Trusted Device\" authentication, meaning signing in on a new device will send a notification to your phone to allow the sign in."
    options:
      - Trusted Device
      - SMS
      - No 2FA
      - Security Key (Unsupported)
  validations:
    required: true
